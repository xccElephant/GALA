### Stage 1: Projector Alignment
# 冻结 LLM + Encoder，只训练 point_proj
# 用自动生成的对齐数据，任务答案只能从点云获得
# 目的：让 projector 学会将 Encoder 特征映射到 Qwen3 能理解的嵌入空间

### model
model_name_or_path: models/Utonia-Qwen3-0.6B
trust_remote_code: true
low_cpu_mem_usage: false

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true       # freeze Utonia backbone (PTv3 Mode3)
freeze_multi_modal_projector: false  # ONLY train this
freeze_language_model: true     # freeze Qwen3 LLM

### dataset
dataset: 3dish_alignment_500k_train
template: pointlm_qwen3
cutoff_len: 8192
max_samples: 1000000
overwrite_cache: true
preprocessing_num_workers: 64
dataloader_num_workers: 32
text_dropout_prob: 0.0

### output
output_dir: saves/train_full_sft/qwen3-0_6b/3dish_alignment_500k_train
logging_steps: 10
save_steps: 900
save_total_limit: 20
overwrite_output_dir: false
save_only_model: false
report_to: wandb
run_name: qwen3-0_6b_3dish_alignment_500k_train

### train
per_device_train_batch_size: 32
gradient_accumulation_steps: 1
disable_gradient_checkpointing: true
learning_rate: 1.0e-3
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
flash_attn: fa2
enable_liger_kernel: true

### eval
eval_dataset: 3dish_alignment_500k_val
val_size: 0.0
per_device_eval_batch_size: 8
eval_strategy: steps
eval_steps: 450
do_eval: true

# run
# mkdir -p saves/train_full_sft/qwen3-0_6b/3dish_alignment_500k_train

# CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 llamafactory-cli train examples/train_full/qwen3-0_6b/3dish_alignment_500k_train/base.yaml 2>&1 | tee saves/train_full_sft/qwen3-0_6b/3dish_alignment_500k_train/train.log

